name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lashmanager_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Limpar artefatos internos do cache
        # Módulos com.lashmanager.* nunca devem vir do cache do Maven — eles são
        # resolvidos direto do reactor a cada build. Um cache restaurado com uma
        # cópia velha/incompleta desses artefatos quebra a resolução de dependências.
        run: rm -rf ~/.m2/repository/com/lashmanager

      - name: Diagnóstico temporário
        run: |
          echo "=== mvn -version ==="
          mvn -version
          echo "=== git log -1 ==="
          git log -1
          echo "=== git status ==="
          git status
          echo "=== env | grep -i maven ==="
          env | grep -i maven || echo "(nenhuma)"
          echo "=== ~/.m2/settings.xml ==="
          cat ~/.m2/settings.xml 2>/dev/null || echo "(não existe)"
          echo "=== ~/.m2/repository/com/lashmanager ==="
          find ~/.m2/repository/com/lashmanager 2>&1 || echo "(não existe)"
          echo "=== lash-clients/pom.xml ==="
          cat lash-clients/pom.xml
          echo "=== compile verbose (grep lash-core/lash-clients) ==="
          mvn -B -X compile 2>&1 | grep -i -B3 -A40 "lash-clients" | head -150 || true

      - name: Verificar formatação (Spotless)
        run: mvn -B spotless:check

      - name: Compilar
        run: mvn -B compile

      - name: Lint de qualidade (PMD)
        run: mvn -B pmd:check

      - name: Rodar testes
        run: mvn -B test

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
